name: daily-sec-report
on:
  schedule:
    - cron: "0 0 * * *"  # 每天 08:00 台北時間
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python src/run.py
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: commit & push
        run: |
          git config user.name "secbot"
          git config user.email "secbot@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "daily report $(date +%F)"
          git push
